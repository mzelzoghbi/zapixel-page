name: Deploy to GitHub Pages

# The site is static -- plain HTML, CSS and images, built from the design
# directory in the design-thoughts repo (zapixel-landing/tools/build-site.py).
# There is nothing to compile, so this uploads site/ as it stands.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # site/CNAME keeps the custom domain and site/app-ads.txt carries the
      # Google ad publisher ID. Both must reach the published root.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: site
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site
